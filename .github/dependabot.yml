version: 2
updates:
  # Maintain dependencies for npm (Vite packages)
  - package-ecosystem: "npm"
    # Look for package.json and package-lock.json (or yarn.lock/pnpm-lock.yaml) in the root directory
    directory: "/" 
    schedule:
      # Check for updates daily
      interval: "weekly"
    # Optional: Add labels to the pull requests Dependabot creates
    labels:
      - "dependencies"
      - "npm"

  # Maintain dependencies for GitHub Actions (workflow files)
  - package-ecosystem: "github-actions"
    # Look for workflow files in the default location
    directory: "/"
    schedule:
      # Check for updates weekly
      interval: "weekly"
